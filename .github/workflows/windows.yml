name: Build Windows download
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check bridge C# syntax against the test API fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE 'test\VegasApiStub.cs'
          $bridge = Join-Path $env:GITHUB_WORKSPACE 'vegas\BCC-Export-Effects.cs'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:library "/out:$env:RUNNER_TEMP\BridgeSyntaxCheck.dll" /reference:System.Drawing.dll /reference:System.Windows.Forms.dll /reference:System.Xml.dll /reference:System.Core.dll $fixture $bridge 2>&1 | Tee-Object -Variable compilerOutput
          $compilerExit = $LASTEXITCODE
          if ($compilerExit -ne 0) {
            foreach ($line in $compilerOutput) { Write-Host "::error::$line" }
            exit $compilerExit
          }
      - run: npm run build:win
      - name: Launch the packaged Windows app and verify its real renderer and IPC
        run: node scripts/smoke-packaged.js "dist/BCC FX Manager-win32-x64/BCC FX Manager.exe"
      - run: npm run build:installer
      - uses: actions/upload-artifact@v4
        with:
          name: BCC-FX-Manager-Windows-x64
          path: |
            dist/BCC-FX-Manager-Windows-x64.zip
            dist/installer/BCC-FX-Manager-Setup.exe
          if-no-files-found: error
      - name: Publish the Windows preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "preview-0.2.0-${{ github.run_number }}"
          gh release create $tag dist/BCC-FX-Manager-Windows-x64.zip dist/installer/BCC-FX-Manager-Setup.exe --target "${{ github.sha }}" --title "BCC FX Manager 0.2.0 preview" --notes-file RELEASE_NOTES.md --prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
